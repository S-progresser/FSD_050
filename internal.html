<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>
    <style>
        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
        }

        button {
            background-color: orange;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>
        Welcome to Web Development
    </h1>

    <p>
        This paragraph uses Internal CSS.
    </p>

    <button>
        Click Me
    </button>

</body>
</html>
