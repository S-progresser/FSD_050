<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 400px;
            margin: 50px auto;
            padding: 30px;
            box-shadow: 0 0 10px gray;
        }

        input {
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 10px 25px;
            margin-top: 15px;
        }

        #result {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Grade Calculator</h1>

        <input type="number" id="marks" placeholder="Enter marks">

        <br>

        <button onclick="calculateGrade()">
            Calculate Grade
        </button>

        <p id="result"></p>

    </div>

    <script>

        function calculateGrade() {

            let inputVal = document.getElementById("marks").value;
            let marks = Number(inputVal);
            let resultElement = document.getElementById("result");

            if (inputVal === "" || marks < 0 || marks > 100) {
                resultElement.innerHTML = "Please enter marks between 0 and 100.";
                return;
            }

            let grade;

        
            switch (true) {
                case (marks >= 90):
                    grade = "A+";
                    break;
                case (marks >= 80):
                    grade = "A";
                    break;
                case (marks >= 70):
                    grade = "B";
                    break;
                case (marks >= 60):
                    grade = "C";
                    break;
                case (marks >= 50):
                    grade = "D";
                    break;
                default:
                    grade = "F";
            }

            resultElement.innerHTML = 
                "Marks: " + marks + "<br>" +
                "Grade: " + grade;
        }

    </script>

</body>
</html>
